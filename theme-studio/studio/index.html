x-wrap:wrap}}</style><header><h1>Clockwise</h1><span>原生主题工坊</span><a href="./device.html">设备管理</a></header><main>
<section class="card"><h2>USB 设备</h2><div class="row"><button id="usb-connect">连接 USB 设备</button><button id="usb-disconnect" disabled>断开串口</button><label class="button">导入 CWP 安装包<input id="usb-file" type="file" accept=".cwp" style="display:none"></label><a class="button" href="../#config">Wi-Fi 与屏幕驱动设置</a></div><p id="usb-state" role="status">连接后可直接安装主题，无需先配置 Wi-Fi。</p><progress id="usb-progress" value="0" max="100" hidden></progress></section>
<section class="card"><h2>二进制主题应用</h2><p>选择应用或制作图片时钟，直接通过 USB 安装，也可下载安装包。</p><label style="max-width:260px">目标芯片<select id="chip"><option value="esp32s3">ESP32-S3</option><option value="esp32">ESP32</option></select></label><p id="state" role="status">正在读取主题…</p><div id="apps" class="grid"></div></section>
<section class="card" id="maker"></section>
<section class="card"><h2>让 Codex 制作主题</h2><p>选择芯片、填写想法，下方实时生成包含项目地址、SDK、构建与安装步骤的完整提示词。</p>
<div class="field-row"><label>主题 ID<input id="prompt-id" value="my-clock" pattern="[a-z0-9][a-z0-9-]*" maxlength="40"></label><label>目标帧率<select id="prompt-fps"><option>30</option><option selected>60</option><option>120</option><option>240</option></select></label></div>
<label>主题想法<textarea id="prompt-idea" style="min-height:100px" placeholder="描述画面风格、动画、交互、颜色和需要的素材"></textarea></label>
<div class="row"><label><input data-sensor="imu" type="checkbox" style="display:inline;width:auto">重力与陀螺仪</label><label><input data-sensor="temperature" type="checkbox" style="display:inline;width:auto">温度</label><label><input data-sensor="humidity" type="checkbox" style="display:inline;width:auto">湿度</label></div>
<textarea id="prompt" aria-label="Codex 提示词" readonly style="min-height:440px"></textarea><div class="row"><button id="copy">复制完整提示词</button><a class="button" href="./theme-guide.html">SDK 开发手册</a><a class="button" href="../native-sdk.zip">下载 C/C++ SDK</a><a class="button" href="https://github.com/AntonVanke/HUB-75E">GitHub 项目</a></div><p id="copy-state" role="status"></p></section>
