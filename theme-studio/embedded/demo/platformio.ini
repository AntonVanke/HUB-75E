[platformio]
default_envs = esp32-64x64

[env:esp32-64x64]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -Os
build_flags =
  -O2
  -DARDUINO_RUNNING_CORE=0
  -DARDUINO_EVENT_RUNNING_CORE=0
lib_deps =
  symlink://..
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
  adafruit/Adafruit GFX Library@1.12.3
  adafruit/Adafruit BusIO@1.17.4

[env:esp32s3-hub75]
extends = env:esp32-64x64
lib_deps =
  ${env:esp32-64x64.lib_deps}
  https://github.com/adafruit/Adafruit_Protomatter.git#1.7.0
extra_scripts =
  post:tools/fix_s3_panel_clock.py
  post:tools/fix_s3_protomatter.py
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions-s3-8mb.csv
board_upload.flash_size = 8MB
upload_port = COM28
upload_speed = 460800
build_unflags =
  ${env:esp32-64x64.build_unflags}
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  ${env:esp32-64x64.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DHUB75_S3_BOARD
