<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clockwise · 主题工坊</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f7f8;color:#17232b;font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{background:linear-gradient(110deg,#1b5796,#119454);color:white;padding:22px max(24px,calc((100vw - 1100px)/2));display:flex;gap:24px;align-items:center}header h1{margin:0;font-size:32px}header a{color:white;margin-left:auto}main{max-width:1150px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce5e8;padding:22px;margin:0 0 20px}.card h2{font-size:20px;font-weight:500;background:#607f8b;color:white;padding:12px 22px;margin:-22px -22px 18px}button,.button{border:0;border-radius:3px;background:#87cfe6;color:#113342;padding:10px 16px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}input,select,textarea{display:block;width:100%;font:inherit;padding:9px;border:1px solid #ccd9de;margin:6px 0 14px}input[type=color]{height:44px}label{display:block}a{color:#176184}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.settings-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;gap:12px;flex-wrap:wrap}small,.muted{color:#617a85}textarea{font:13px/1.7 Consolas,monospace;min-height:270px}footer{padding:16px;text-align:center;color:#617a85}.badge{display:inline-block;background:#edf7f3;padding:3px 9px;margin:0 6px 9px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f8;padding:16px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #dce5e8;text-align:left}button:focus-visible,a:focus-visible{outline:3px solid #167db7}button:disabled{opacity:.5}@media(max-width:650px){.grid,.settings-grid,.field-row{grid-template-columns:1fr}main{padding:14px}header{padding:16px;flex-wrap:wrap}}</style><header><h1>Clockwise</h1><span>原生主题工坊</span><a href="./device.html">设备管理</a></header><main><section class="card"><h2>二进制主题应用</h2><p>选择应用或制作图片时钟，生成包含素材的安装包。</p><label style="max-width:260px">目标芯片<select id="chip"><option value="esp32s3">ESP32-S3</option><option value="esp32">ESP32</option></select></label><p id="state" role="status">正在读取主题…</p><div id="apps" class="grid"></div></section><section class="card" id="maker"></section><section class="card"><h2>让 Codex 制作主题</h2><p>复制提示词，填写主题效果和目标芯片，让 Codex 编写 C/C++ 并交付可安装包。</p><textarea id="prompt" aria-label="Codex 提示词">请为 HUB-75E 制作 C/C++ 原生二进制主题，不使用 Lua、JavaScript 字节码或 GIF 播放代替逻辑。
先阅读 theme-studio/native/README.md、include/cw_theme.h 和相关原生主题示例。
目标为 64×64 HUB75，芯片为【ESP32-S3 / ESP32】，主题效果为【描述】。
在 native/themes/【唯一 id】创建 theme.cpp、theme.json 和资源，使用独立 packageName。
实现 CwTheme ABI 1 生命周期，通过 CwApi 绘图/读传感器/读资源。
所有常量资源随 CWP3 打包；大素材按需分块读取；帧循环不申请内存、不读网络、不阻塞、不操作 GPIO。
使用固定步长物理和 dtMs 动画，正确处理短帧、长帧、传感器缺失、主题切换。
声明真实 stateBytes、graphicsBytes、sensors 和目标帧率，检查资源读取边界。
执行 python theme-studio/native/build.py 【id】 --chip 【esp32s3 或 esp32】。
交付可导入的 .cwp、源码和实际执行的验证结果；未实测的 FPS 只写目标值。
不要修改设备的 Wi-Fi 或屏幕驱动，不要烧录或发布，除非我明确要求。
</textarea><div class="row"><button id="copy">复制提示词</button><a class="button" href="./theme-guide.html">SDK 开发手册</a><a class="button" href="../native-sdk.zip">下载 C/C++ SDK</a></div><p id="copy-state" role="status"></p></section></main><footer id="credits"></footer><script type="module">
import {creditsHTML} from "./credits.mjs";
document.getElementById("credits").innerHTML=creditsHTML;
import {imageClockControls} from './image-clock.mjs';
import {refreshLanguage} from './i18n.mjs';
imageClockControls(document.getElementById('maker'));refreshLanguage();
let apps=[];const chip=document.getElementById('chip'),list=document.getElementById('apps');
function render(){list.replaceChildren(...apps.filter(a=>a.requirements.chips.includes(chip.value)).map(app=>{const card=document.createElement('article'),title=document.createElement('h3'),text=document.createElement('p'),info=document.createElement('p'),link=document.createElement('a');title.textContent=app.title;text.textContent=app.description;info.textContent='C++ · '+(app.bytes/1024).toFixed(1)+' KiB · '+app.requirements.targetFps+' FPS 目标';link.textContent='下载安装包';link.className='button';link.href='../native/dist/'+app.file;link.download=app.file;card.append(title,text,info,link);return card;}));}
chip.onchange=render;try{const r=await fetch('../native/dist/catalog.json');if(!r.ok)throw Error('主题库尚未构建');apps=(await r.json()).apps;render();document.getElementById('state').textContent='4 个原生主题 · 需要原生架构固件 v1.0.1';}catch(e){document.getElementById('state').textContent=e.message;}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('prompt').value);document.getElementById('copy-state').textContent='提示词已复制';}catch{document.getElementById('prompt').select();document.getElementById('copy-state').textContent='请复制已选中的提示词';}};
</script></html>
